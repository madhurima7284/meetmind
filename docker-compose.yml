version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: meetmind_postgres
    restart: always
    environment:
      POSTGRES_USER: meetmind
      POSTGRES_PASSWORD: meetmind_password
      POSTGRES_DB: meetmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetmind_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://meetmind:meetmind_password@db:5432/meetmind_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WHISPER_MODEL=base
    depends_on:
      - db

volumes:
  postgres_data:
